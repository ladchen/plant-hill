<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>植物山 PLANT HILL · 甄选原料 · 一触融合（成分气泡交互组件）</title>
<style>
:root{
  --bg:#0d0b08; --panel:#191409;
  --line-d:rgba(217,180,106,.22);
  --gold:#b98a3e; --gold-b:#d9b46a; --gold-deep:#7d5f2a;
  --ink-d:#f2ecdd; --muted-d:#9d8c6e; --dim-d:#6e624c;
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
  --serif-en:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink-d);font-family:var(--sans);line-height:1.7;overflow-x:hidden;min-height:100vh}
img{max-width:100%;display:block}
::selection{background:rgba(217,180,106,.3)}

.wrap{max-width:720px;margin:0 auto;padding:36px 20px 60px}
.sec-head{text-align:center;margin-bottom:36px}
.sec-kicker{font-size:10px;letter-spacing:.4em;color:var(--gold);text-indent:.4em;margin-bottom:12px}
.sec-title{font-family:var(--serif);font-weight:400;font-size:clamp(25px,5.4vw,36px);line-height:1.3;letter-spacing:.04em;color:var(--gold-b)}
.sec-sub{font-family:var(--serif-en);font-size:9.5px;letter-spacing:.32em;color:var(--dim-d);margin-top:12px;text-transform:uppercase}
.rule{width:44px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold-b),transparent)}

.tabs{display:flex;justify-content:center;gap:10px;margin:0 0 26px;flex-wrap:wrap}
.tab{border:1px solid var(--line-d);background:rgba(25,20,9,.6);color:var(--muted-d);font-family:var(--serif);
  font-size:14px;letter-spacing:.08em;padding:9px 20px;border-radius:999px;cursor:pointer;transition:.3s}
.tab em{font-style:normal;font-family:var(--serif-en);font-size:8.5px;letter-spacing:.16em;display:block;color:var(--dim-d)}
.tab.on{background:linear-gradient(135deg,#8d6c2f,#c9a35c);color:#171106;border-color:var(--gold-b)}
.tab.on em{color:#3d2e12}

.bubble-stage{position:relative;max-width:680px;margin:0 auto;height:min(125vw,620px);min-height:480px;
  background:radial-gradient(50% 46% at 50% 50%,rgba(217,180,106,.08),transparent 70%),
             linear-gradient(170deg,rgba(25,20,9,.5),rgba(13,11,8,.2));
  border:1px solid var(--line-d);border-radius:24px;box-shadow:inset 0 0 60px rgba(217,180,106,.04)}
.bubble-stage::before{content:"";position:absolute;left:50%;top:50%;width:66%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;border:1px dashed rgba(217,180,106,.22);animation:spin 50s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.b-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(28%,92px);z-index:2;border-radius:50%;
  overflow:hidden;border:2px solid var(--gold-b);box-shadow:0 0 0 6px rgba(217,180,106,.12),0 22px 50px -14px rgba(0,0,0,.8);
  background:#fffdf6;transition:box-shadow .4s}
.b-core img{width:100%;aspect-ratio:1/1;object-fit:cover}
.b-core.pulse{animation:corePulse .55s ease}
@keyframes corePulse{0%{box-shadow:0 0 0 6px rgba(217,180,106,.12)}45%{box-shadow:0 0 0 28px rgba(233,210,160,.4),0 0 64px 18px rgba(217,180,106,.5)}100%{box-shadow:0 0 0 6px rgba(217,180,106,.12)}}
.bubble{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;
  width:60px;height:60px;border-radius:50%;cursor:pointer;border:1.5px solid rgba(217,180,106,.65);
  background:radial-gradient(60% 60% at 32% 26%,rgba(233,210,160,.3),rgba(34,25,7,.92));
  box-shadow:0 6px 18px -6px rgba(0,0,0,.6),inset 0 0 14px rgba(217,180,106,.12);
  transition:left .7s cubic-bezier(.5,-.1,.6,1),top .7s cubic-bezier(.5,-.1,.6,1),transform .7s,opacity .6s,border-color .3s;
  animation:bfloat 3.4s ease-in-out infinite;padding:2px}
.bubble::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px dashed rgba(217,180,106,.3);pointer-events:none}
.bubble img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.bubble span{font-family:var(--serif);font-size:12.5px;color:var(--ink-d);padding:0 5px;z-index:1;text-align:center;line-height:1.35}
.bubble.small span{font-size:10.5px}
.bubble .lbl{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.04em;
  color:var(--muted-d);white-space:nowrap;font-family:var(--serif);pointer-events:none}
.bubble .lbl::before{content:"";position:absolute;left:50%;top:-7px;width:1px;height:6px;background:rgba(217,180,106,.4)}
@keyframes bfloat{0%,100%{margin-top:0}50%{margin-top:-3px}}
.bubble.merged{pointer-events:none;opacity:0;transform:scale(.1)}
.bubble:hover,.bubble:active{border-color:var(--gold-b);box-shadow:0 0 20px -2px rgba(217,180,106,.3),0 6px 18px -6px rgba(0,0,0,.6)}
.b-count{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.24em;color:var(--gold-b);
  background:rgba(25,20,9,.9);border:1px solid var(--line-d);padding:6px 16px;border-radius:999px;white-space:nowrap;z-index:4}
.b-done{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);z-index:5;text-align:center;
  background:rgba(30,23,10,.96);border:1px solid var(--gold-b);border-radius:18px;padding:26px 34px;
  transition:transform .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 30px 70px -20px rgba(0,0,0,.9)}
.b-done.show{transform:translate(-50%,-50%) scale(1)}
.b-done b{display:block;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.16em;color:var(--gold-b);margin-bottom:8px}
.b-done span{font-size:12px;color:var(--muted-d);letter-spacing:.08em}
.burst{position:absolute;pointer-events:none;z-index:6}
.burst i{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;background:radial-gradient(#f6e6bc,#c9a35c);animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
.bubble-tip{text-align:center;font-size:11px;color:var(--dim-d);letter-spacing:.2em;margin-top:20px}
.reset-btn{display:block;margin:18px auto 0;border:1px solid var(--line-d);background:transparent;color:var(--gold-b);
  font-family:var(--sans);font-size:12px;letter-spacing:.24em;padding:9px 26px;border-radius:999px;cursor:pointer;transition:.3s}
.reset-btn:hover{border-color:var(--gold-b);background:rgba(217,180,106,.08)}
.foot{text-align:center;font-size:11px;color:var(--dim-d);letter-spacing:.1em;margin-top:40px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.embed{min-height:auto;background:#0d0b08}
.embed .wrap{max-width:760px;padding:24px 18px 26px}
.embed .sec-head{margin-bottom:24px}
.embed .tabs{display:none}
.embed .foot{display:none}
</style>
</head>

  <div class="sec-head">

  <div class="tabs">

  <button class="reset-btn" id="resetBtn">重 新 开 始</button>

  <div class="foot">植物山 PLANT HILL · 成分融合交互组件</div>

      bubbles:[
        {n:'赤藓糖醇'},
        {n:'抗性糊精'},
        {n:'人参组培不定根粉'},
        {n:'水苏糖'},
        {n:'三氯蔗糖'}
      ]
    }
  };

  var stage=$('#bStage'),bubblesEls=[],merged=0,total=0,cur='1';

  /* 排斥求解器: 零碰撞布局 */
  function solvePositions(n,w,h){
    var pts=[],minD=68,coreR=52+34,R=Math.min(w,h)*0.42;
    for(var i=0;i<n;i++){
      var a=i/n*6.283+0.4;
      pts.push({x:w/2+Math.cos(a)*R,y:h/2+Math.sin(a)*R*0.85});
    }
    for(var it=0;it<200;it++){
      for(var i=0;i<n;i++){
        for(var j=i+1;j<n;j++){
          var dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y;
          var d=Math.sqrt(dx*dx+dy*dy);
          if(d<minD&&d>0.01){
            var push=(minD-d)/2,ux=dx/d,uy=dy/d;
            pts[i].x-=ux*push;pts[i].y-=uy*push;
            pts[j].x+=ux*push;pts[j].y+=uy*push;
          }
        }
        var dxc=pts[i].x-w/2,dyc=pts[i].y-h/2;
        var dc=Math.sqrt(dxc*dxc+dyc*dyc);
        if(dc<coreR){
          var push=coreR-dc,ux=dc>0.01?dxc/dc:1,uy=dc>0.01?dyc/dc:0;
          pts[i].x+=ux*push;pts[i].y+=uy*push;
        }
        pts[i].x=Math.max(34,Math.min(w-34,pts[i].x));
        pts[i].y=Math.max(36,Math.min(h-52,pts[i].y));
      }
    }
    return pts;
  }

  function buildBubbles(names){
    $$('.bubble',stage).forEach(function(b){b.remove()});
    bubblesEls=[];merged=0;total=names.length;
    $('#bCount').textContent='已融合 0 / '+total;
    $('#bDone').classList.remove('show');
    names.forEach(function(it,i){
      var b=document.createElement('div');
      b.className='bubble'+(it.n.length>6?' small':'');
      if(it.img){b.innerHTML='<img src="'+it.img+'" alt="'+it.n+'"><span class="lbl">'+it.n+'</span>';}
      else{b.innerHTML='<span>'+it.n+'</span>';}
      b.dataset.idx=i;
      stage.appendChild(b);
      bubblesEls.push(b);
      b.addEventListener('click',function(){mergeBubble(b)});
    });
    placeBubbles();
  }

  function placeBubbles(){
    var w=stage.clientWidth,h=stage.clientHeight;
    var pts=solvePositions(bubblesEls.length,w,h);
    bubblesEls.forEach(function(b,i){
      b.style.left=(pts[i].x-30)+'px';b.style.top=(pts[i].y-30)+'px';
      b.style.animationDelay=(-i*0.42)+'s';
    });
  }

  function goldBurst(x,y,n){
    var b=$('#bBurst');
    b.style.left=(x-4)+'px';b.style.top=(y-4)+'px';b.innerHTML='';
    for(var i=0;i<n;i++){
      var el=document.createElement('i');
      var ang=Math.random()*6.283,dist=70+Math.random()*150;
      el.style.setProperty('--dx',(Math.cos(ang)*dist)+'px');
      el.style.setProperty('--dy',(Math.sin(ang)*dist)+'px');
      b.appendChild(el);
    }
    setTimeout(function(){b.innerHTML=''},1100);
  }

  function reportHeight(){
    if(!embedded||parent===window)return;
    parent.postMessage({type:'fusion-height',height:Math.ceil(document.documentElement.scrollHeight)},'*');
  }

  function mergeBubble(b){
    if(b.classList.contains('merged'))return;
    b.classList.add('merged');
    var r=stage.getBoundingClientRect();
    b.style.left=(r.width/2-30)+'px';b.style.top=(r.height/2-30)+'px';
    merged++;
    $('#bCount').textContent='已融合 '+merged+' / '+total;
    var core=$('#bCore');
    core.classList.remove('pulse');void core.offsetWidth;core.classList.add('pulse');
    if(!reduced)goldBurst(r.width/2,r.height/2,12);
    if(merged===total){
      setTimeout(function(){
        $('#bDone').classList.add('show');
        if(!reduced)goldBurst(r.width/2,r.height/2,40);
      },700);
    }
  }

  function render(p){
    cur=p;
    var d=P[p];
    $('#bCoreImg').src=d.core;
    buildBubbles(d.bubbles);
    if(embedded){
      var isRg2=p==='2';
      $('.sec-kicker').textContent=isRg2?'RG2 FORMULA FUSION':'INGREDIENTS FUSION';
      $('.sec-title').textContent=isRg2?'配方气泡 · 一触融合':'甄选原料 · 一触融合';
      $('.sec-sub').textContent=isRg2?'Tap the Formula · Merge into RG2':'Tap the Bubbles · Merge into the Product';
      $('.bubble-tip').textContent=isRg2?'轻点气泡，让每一味配方融入 RG2 产品核心':'轻点气泡，让每一味原料融入产品 · 集齐组方见证精华凝聚';
    }
    setTimeout(reportHeight,0);
  }

  $$('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      if(t.dataset.p===cur)return;
      $$('.tab').forEach(function(x){x.classList.remove('on')});t.classList.add('on');
      render(t.dataset.p);
      if(history.replaceState){history.replaceState(null,'','#'+(t.dataset.p==='2'?'rg2':'lushen'));}
    });
  });

  $('#resetBtn').addEventListener('click',function(){render(cur)});
  addEventListener('resize',function(){placeBubbles();reportHeight()});

  var initialHash=location.hash.replace('#','');
  var initialProduct=params.get('product');
  render(initialProduct==='rg2'||initialHash==='rg2'?'2':initialProduct==='lushen'||initialHash==='lushen'?'1':'1');
  addEventListener('load',reportHeight);
  if(window.ResizeObserver){new ResizeObserver(reportHeight).observe(document.body);}
})();
